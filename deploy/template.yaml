AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Wade or Wait - Infrastructure as Code for Free-Tier/Low-Cost AWS Deployment.
  Architecture: EC2 (t3.micro Free-Tier single container), DynamoDB (on-demand, TTL),
  S3 (private, 14-day lifecycle, CORS enabled), OpenAI-compatible Vision API, CloudWatch Logs (7-day retention).

Parameters:
  ImageUri:
    Type: String
    Description: URI of the container image in Amazon ECR (e.g. 123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/wadenwait-prod:latest)

  VisionApiBaseUrl:
    Type: String
    Description: Base URL for OpenAI-compatible vision chat completions API (e.g. https://api.groq.com/openai/v1)

  VisionModel:
    Type: String
    Description: Vision model identifier (e.g. qwen/qwen3.8-27b)

  VisionApiKey:
    Type: String
    NoEcho: true
    Description: Secret API key for OpenAI-compatible vision API

  DailyAnalysisCap:
    Type: Number
    Default: 100
    Description: Global atomic daily cap on vision analysis model calls

  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address to receive AWS Budget alerts at $10, $25, and $50

  InstanceType:
    Type: String
    Default: "t3.micro"
    AllowedValues: ["t3.micro", "t3.small", "t2.micro", "t2.small"]
    Description: EC2 instance type (t3.micro is AWS Free Tier eligible)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI ID retrieved from SSM Parameter Store

  # Retained for backwards compatibility with deploy parameter passing
  AppRunnerCpu:
    Type: String
    Default: "0.25 vCPU"
    Description: Unused - retained for parameter compatibility

  AppRunnerMemory:
    Type: String
    Default: "0.5 GB"
    Description: Unused - retained for parameter compatibility

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # -------------------------------------------------------------------
  # S3 Storage (Private, Block Public Access, CORS enabled, 14-day Lifecycle)
  # -------------------------------------------------------------------
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter14Days
            Status: Enabled
            ExpirationInDays: 14

  # -------------------------------------------------------------------
  # DynamoDB Tables (On-Demand Pay-Per-Request, TTL Enabled)
  # -------------------------------------------------------------------
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cell
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: cell
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: IdIndex
          KeySchema:
            - AttributeName: id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  VotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH
        - AttributeName: device_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ClearTimeLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: road_id
          AttributeType: S
        - AttributeName: cell_key
          AttributeType: S
        - AttributeName: issued_at
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RoadIndex
          KeySchema:
            - AttributeName: road_id
              KeyType: HASH
            - AttributeName: issued_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CellIndex
          KeySchema:
            - AttributeName: cell_key
              KeyType: HASH
            - AttributeName: issued_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # -------------------------------------------------------------------
  # CloudWatch Logs (7-Day Retention)
  # -------------------------------------------------------------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/ec2/${AWS::StackName}-service"
      RetentionInDays: 7

  # -------------------------------------------------------------------
  # IAM Roles (Least Privilege for EC2 Instance)
  # -------------------------------------------------------------------
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: AppInstanceLeastPrivilegePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3 photo storage
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:HeadObject
                Resource: !Sub "${PhotoBucket.Arn}/*"

              # DynamoDB tables and indexes
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ReportsTable.Arn
                  - !Sub "${ReportsTable.Arn}/index/*"
                  - !GetAtt VotesTable.Arn
                  - !GetAtt ClearTimeLogTable.Arn
                  - !Sub "${ClearTimeLogTable.Arn}/index/*"

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "${AppLogGroup.Arn}:*"

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref AppInstanceRole

  # -------------------------------------------------------------------
  # EC2 Security Group (HTTP Port 80 and Port 8000)
  # -------------------------------------------------------------------
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access for Wade or Wait container
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0

  # -------------------------------------------------------------------
  # EC2 Instance (Free-Tier t3.micro running container on startup)
  # -------------------------------------------------------------------
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref AppInstanceProfile
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
        HttpTokens: optional
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          echo "Starting initialization at $(date)"
          dnf update -y
          dnf install -y docker
          systemctl enable --now docker

          # Login to ECR
          aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com

          # Run Wade or Wait container
          docker pull ${ImageUri}
          docker run -d --restart always \
            -p 80:8000 \
            -p 8000:8000 \
            -e DB_BACKEND=dynamodb \
            -e STORAGE_BACKEND=s3 \
            -e S3_BUCKET=${PhotoBucket} \
            -e REPORTS_TABLE=${ReportsTable} \
            -e VOTES_TABLE=${VotesTable} \
            -e CLEAR_TIME_LOG_TABLE=${ClearTimeLogTable} \
            -e LLM_PROVIDER=openai_compat \
            -e PERCEPTION_MODE=vlm \
            -e VISION_API_BASE_URL="${VisionApiBaseUrl}" \
            -e VISION_MODEL="${VisionModel}" \
            -e VISION_API_KEY="${VisionApiKey}" \
            -e DAILY_ANALYSIS_CAP="${DailyAnalysisCap}" \
            -e AWS_DEFAULT_REGION=${AWS::Region} \
            ${ImageUri}

          echo "Initialization finished at $(date)"

  # -------------------------------------------------------------------
  # AWS Budgets Alerts ($10, $25, $50)
  # -------------------------------------------------------------------
  CostBudget10:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-budget-10usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  CostBudget25:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-budget-25usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 25
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  CostBudget50:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-budget-50usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 50
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ServiceUrl:
    Description: HTTP URL of the Wade or Wait application
    Value: !Sub "http://${AppInstance.PublicIp}"

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref AppInstance

  PublicIp:
    Description: EC2 Instance Public IP
    Value: !GetAtt AppInstance.PublicIp

  ReportsTableName:
    Description: DynamoDB Reports table name
    Value: !Ref ReportsTable

  VotesTableName:
    Description: DynamoDB Votes table name
    Value: !Ref VotesTable

  ClearTimeLogTableName:
    Description: DynamoDB Clear Time Log table name
    Value: !Ref ClearTimeLogTable

  PhotoBucketName:
    Description: S3 Photo Bucket name
    Value: !Ref PhotoBucket
